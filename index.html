<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C41230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>LWH WMS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <a href="#/" class="brand">
      <span class="brand-mark" id="brand-mark">LWH</span>
      <span class="brand-text" id="brand-text">Warehouse</span>
    </a>
    <div class="header-right" id="header-right"></div>
  </header>

  <main id="view" class="view"><div class="loading">Loading...</div></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="btn-icon" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Print output (labels, receipts) renders here; hidden on screen -->
  <div id="print-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/print.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
